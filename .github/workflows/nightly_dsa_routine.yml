name: Nightly DSA Routine

on:
  schedule:
    # Trigger at 00:00 UTC? No: 8:30 PM IST (20:30 IST) is 15:00 UTC (15:00 UTC = 20:30 IST)
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows one-click manual test from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-dsa-routine:
    name: Autonomous Java DSA Progression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Java JDK 21 (for syntax & javac validation)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config user.name "sujaypaul27"
          git config user.email "sujaypaul2711@gmail.com"

      - name: Execute Daily DSA Routine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-2.5-flash'
        run: |
          python scripts/daily_dsa_commit.py
